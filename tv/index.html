<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>6789 — Kho Ứng Dụng TV</title>
<style>
:root {
    --font-sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    --bg-base: #111113;
    --bg-window: #1c1c1e;
    --bg-sidebar: #161618;
    --bg-card: #242426;
    --bg-card-hover: #2c2c2e;
    --border-hairline: rgba(255, 255, 255, 0.08);
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --mac-blue: #0071e3;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: var(--font-sf);
    background-color: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
}

/* ================= macOS Minimal Menu Bar ================= */
.menubar {
    height: 30px;
    padding: 0 18px;
    background: rgba(22, 22, 24, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--border-hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    position: sticky;
    top: 0;
    z-index: 100;
}
.menubar-left, .menubar-right {
    display: flex;
    align-items: center;
    gap: 16px;
}
.menubar a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.15s;
}
.menubar a:hover, .menubar a.active {
    color: var(--text-primary);
}
.menubar a.brand {
    color: var(--text-primary);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* ================= Main macOS Window ================= */
.app-container {
    flex: 1;
    max-width: 1280px;
    width: 100%;
    margin: 18px auto 24px;
    padding: 0 16px;
}

.mac-window {
    display: grid;
    grid-template-columns: 230px 1fr;
    min-height: calc(100vh - 84px);
    background: var(--bg-window);
    border: 0.5px solid var(--border-hairline);
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    background: var(--bg-sidebar);
    border-right: 0.5px solid var(--border-hairline);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.traffic-lights {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 6px;
}
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot-r { background: #ff5f56; }
.dot-y { background: #ffbd2e; }
.dot-g { background: #27c93f; }

.search-wrap { position: relative; }
.search-input {
    width: 100%;
    padding: 7px 10px 7px 30px;
    border-radius: 7px;
    background: #242426;
    border: 0.5px solid var(--border-hairline);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
}
.search-input:focus {
    border-color: var(--mac-blue);
}
.search-ico {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: var(--text-secondary); pointer-events: none;
}

.nav-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    padding: 0 10px;
    margin-bottom: -6px;
}

.nav-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 7px;
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    text-decoration: none;
    transition: background-color 0.12s, color 0.12s;
}
.nav-btn:hover, .nav-btn:focus-visible {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
    outline: none;
}
.nav-btn.active {
    background: #2c2c2e;
    color: var(--text-primary);
    font-weight: 600;
}

.sidebar-bottom {
    margin-top: auto;
    padding-top: 12px;
    border-top: 0.5px solid var(--border-hairline);
    display: flex;
    flex-direction: column;
    gap: 2px;
}

/* Main Content */
.content-area {
    padding: 26px 30px 40px;
    overflow-y: auto;
}

.page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 0.5px solid var(--border-hairline);
}
.page-header h1 {
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: -0.02em;
}
.page-header span {
    font-size: 13px;
    color: var(--text-secondary);
}

/* Category Section */
.cat-section {
    margin-bottom: 32px;
}
.cat-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
}

/* App Grid */
.app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
}

.app-tile {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 15px;
    border-radius: 12px;
    background: var(--bg-card);
    border: 0.5px solid var(--border-hairline);
    text-decoration: none;
    color: var(--text-primary);
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.app-tile:hover, .app-tile:focus-visible {
    outline: none;
    background: var(--bg-card-hover);
    border-color: rgba(255, 255, 255, 0.22);
    transform: translateY(-1px);
}

.app-tile:active {
    transform: scale(0.99);
}

.app-icon {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    object-fit: contain;
    background: #18181a;
    flex-shrink: 0;
    border: 0.5px solid rgba(255, 255, 255, 0.06);
    display: grid;
    place-items: center;
    font-size: 1.5rem;
}

.app-meta {
    flex: 1;
    min-width: 0;
}

.app-name {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.app-desc {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.btn-get {
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    transition: background-color 0.15s, color 0.15s;
}
.app-tile:hover .btn-get, .app-tile:focus-visible .btn-get {
    background: var(--mac-blue);
    color: #fff;
}

/* Toast Notification */
.mac-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 200;
    background: #2c2c2e;
    border: 0.5px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

/* ================= Auto-Responsive & Multi-Device Optimization ================= */
.device-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 999px;
    background: rgba(0, 113, 227, 0.14);
    border: 0.5px solid rgba(100, 210, 255, 0.25);
    color: #64d2ff;
    font-size: 11px;
    font-weight: 600;
}

.app-tile:focus-visible {
    outline: 2.5px solid #64d2ff;
    outline-offset: 2px;
    background: #303034;
    box-shadow: 0 10px 28px rgba(0, 113, 227, 0.35);
    transform: translateY(-2px) scale(1.015);
}

/* 1. Large Screen / Smart TV 1080p & 4K (1600px+) */
@media (min-width: 1600px) {
    .app-container { max-width: 1680px; padding: 0 28px; }
    .mac-window { grid-template-columns: 270px 1fr; }
    .app-grid { grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
    .app-tile { padding: 16px 18px; border-radius: 14px; }
    .app-icon { width: 64px; height: 64px; border-radius: 15px; }
    .app-name { font-size: 15.5px; }
    .app-desc { font-size: 13px; }
    .btn-get { padding: 7px 16px; font-size: 13px; }
    .nav-btn { font-size: 14.5px; padding: 10px 12px; }
    .page-header h1 { font-size: 1.7rem; }
}

/* 2. Tablet & Small Laptop (768px - 1024px) */
@media (max-width: 1024px) {
    .mac-window { grid-template-columns: 195px 1fr; }
    .content-area { padding: 20px 20px 32px; }
    .app-grid { grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 10px; }
}

/* 3. Mobile & Compact Tablet (<= 820px) */
@media (max-width: 820px) {
    .app-container { margin: 8px auto 16px; padding: 0 8px; }
    .mac-window {
        grid-template-columns: 1fr;
        min-height: calc(100vh - 54px);
        border-radius: 14px;
    }
    .sidebar {
        border-right: 0;
        border-bottom: 0.5px solid var(--border-hairline);
        padding: 12px;
        gap: 10px;
        position: sticky;
        top: 30px;
        z-index: 50;
        background: rgba(22, 22, 24, 0.94);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }
    .traffic-lights, .nav-label, .sidebar-bottom { display: none; }
    .nav-list {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 2px;
        gap: 6px;
        scrollbar-width: none;
    }
    .nav-list::-webkit-scrollbar { display: none; }
    .nav-btn {
        white-space: nowrap;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 12.5px;
    }
    .nav-btn.active {
        background: var(--mac-blue);
        color: #fff;
    }
    .content-area { padding: 16px 12px 28px; }
    .page-header { flex-direction: column; gap: 4px; margin-bottom: 16px; }
    .page-header h1 { font-size: 1.25rem; }
}

/* 4. Small Smartphone (<= 480px) */
@media (max-width: 480px) {
    .menubar { padding: 0 10px; font-size: 11.5px; }
    .menubar-left { gap: 10px; }
    .app-grid { grid-template-columns: 1fr; gap: 9px; }
    .app-tile { padding: 11px 12px; gap: 11px; }
    .app-icon { width: 48px; height: 48px; border-radius: 11px; }
    .app-name { font-size: 13.5px; }
    .btn-get { padding: 5px 11px; font-size: 11.5px; }
}
</style>
</head>

            <div class="search-wrap">
                <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" class="search-input" placeholder="Tìm nhanh..." autocomplete="off">
            </div>

<script src="data/apps.js"></script>
<script>
(function () {
    var catalog = document.getElementById('catalog');
    var searchInput = document.getElementById('search-input');
    var toast = document.getElementById('toast');
    var toastTimer;
    var allItems = [];
    var currentCat = 'all';

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
    }

    // Tự động vẽ Icon SVG phong cách iOS 27 Spatial Liquid Glass 3D khi ứng dụng mới chưa có ảnh icon
    function makeSmartDefaultIcon(name) {
        var clean = (name || '6789').replace(/[^a-zA-Z0-9\u00C0-\u1EF9\s]/g, '').trim();
        var words = clean.split(/\s+/);
        var initials = words.length >= 2
            ? (words[0][0] + words[1][0]).toUpperCase()
            : clean.substring(0, 3).toUpperCase();
        var hash = 0;
        for (var i = 0; i < clean.length; i++) hash = clean.charCodeAt(i) + ((hash << 5) - hash);
        var palettes = [
            ['#00E5FF', '#7928CA', '#FF0080'],
            ['#00F2FE', '#4FACFE', '#7F00FF'],
            ['#30D158', '#0A84FF', '#5E5CE6'],
            ['#FF2D55', '#FF9500', '#7928CA'],
            ['#64D2FF', '#5E5CE6', '#BF5AF2'],
            ['#00C7BE', '#007AFF', '#5856D6']
        ];
        var pal = palettes[Math.abs(hash) % palettes.length];
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">'
            + '<defs>'
            + '<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">'
            + '<stop offset="0%" stop-color="#070812"/><stop offset="100%" stop-color="#101426"/>'
            + '</linearGradient>'
            + '<radialGradient id="orb1" cx="22%" cy="20%" r="55%"><stop offset="0%" stop-color="' + pal[0] + '" stop-opacity="0.72"/><stop offset="100%" stop-color="' + pal[0] + '" stop-opacity="0"/></radialGradient>'
            + '<radialGradient id="orb2" cx="82%" cy="25%" r="52%"><stop offset="0%" stop-color="' + pal[1] + '" stop-opacity="0.68"/><stop offset="100%" stop-color="' + pal[1] + '" stop-opacity="0"/></radialGradient>'
            + '<radialGradient id="orb3" cx="76%" cy="84%" r="58%"><stop offset="0%" stop-color="' + pal[2] + '" stop-opacity="0.64"/><stop offset="100%" stop-color="' + pal[2] + '" stop-opacity="0"/></radialGradient>'
            + '<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">'
            + '<stop offset="0%" stop-color="#fff" stop-opacity="0.24"/><stop offset="100%" stop-color="#fff" stop-opacity="0.06"/>'
            + '</linearGradient>'
            + '<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">'
            + '<stop offset="0%" stop-color="#fff" stop-opacity="0.75"/><stop offset="100%" stop-color="#64D2FF" stop-opacity="0.18"/>'
            + '</linearGradient>'
            + '</defs>'
            + '<rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>'
            + '<rect x="8" y="8" width="240" height="240" rx="56" fill="url(#orb1)"/>'
            + '<rect x="8" y="8" width="240" height="240" rx="56" fill="url(#orb2)"/>'
            + '<rect x="8" y="8" width="240" height="240" rx="56" fill="url(#orb3)"/>'
            + '<rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="url(#rim)" stroke-width="2.5"/>'
            + '<rect x="22" y="22" width="212" height="212" rx="48" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>'
            + '<text x="128" y="148" text-anchor="middle" fill="#fff" font-family="-apple-system,SF Pro Display,Segoe UI,sans-serif" font-weight="800" font-size="68" letter-spacing="-1">' + initials + '</text>'
            + '</svg>';
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function createAppTile(app) {
        var a = el('a', 'app-tile');
        a.href = app.url;
        a.setAttribute('download', app.name + '.apk');

        var img = el('img', 'app-icon');
        img.src = app.icon || makeSmartDefaultIcon(app.name);
        img.alt = app.name;
        img.loading = 'lazy';
        img.onerror = function() {
            if (!img.dataset.fallbackDone) {
                img.dataset.fallbackDone = '1';
                img.src = makeSmartDefaultIcon(app.name);
            }
        };

        var meta = el('div', 'app-meta');
        meta.append(
            el('span', 'app-name', app.name),
            el('span', 'app-desc', app.desc || 'Gói APK Android TV')
        );

        var btn = el('span', 'btn-get', 'Tải APK');
        a.append(img, meta, btn);

        a.addEventListener('click', function () {
            toast.textContent = 'Đang tải xuống: ' + app.name + '.apk';
            toast.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toast.hidden = true; }, 3000);
        });

        return {
            el: a,
            name: app.name.toLowerCase(),
            desc: (app.desc || '').toLowerCase()
        };
    }

    function getMergedData() {
        var rawStore = window.STORE_DATA ? JSON.parse(JSON.stringify(window.STORE_DATA)) : [];
        var savedStore = localStorage.getItem('6789_store_data');
        if (!savedStore) return rawStore;
        try {
            var local = JSON.parse(savedStore);
            var localMap = {};
            local.forEach(function (cat) {
                (cat.apps || []).forEach(function (a) {
                    localMap[a.name] = a;
                });
            });
            rawStore.forEach(function (cat) {
                cat.apps.forEach(function (a) {
                    var localApp = localMap[a.name];
                    if (localApp) {
                        if (localApp.hidden !== undefined) a.hidden = localApp.hidden;
                    }
                });
            });
            return rawStore;
        } catch (e) {
            return rawStore;
        }
    }

    function renderStore() {
        catalog.innerHTML = '';
        allItems = [];
        var data = getMergedData();

        data.forEach(function (cat) {
            var sec = el('section', 'cat-section');
            sec.dataset.catId = cat.id;
            sec.append(el('h2', 'cat-title', cat.title));

            var grid = el('div', 'app-grid');
            cat.apps.forEach(function (app) {
                if (app.hidden) return;
                var tileObj = createAppTile(app);
                tileObj.catId = cat.id;
                allItems.push(tileObj);
                grid.append(tileObj.el);
            });

            if (grid.children.length > 0) {
                sec.append(grid);
                catalog.append(sec);
            }
        });
    }

    function filterStore() {
        var q = searchInput.value.trim().toLowerCase();
        allItems.forEach(function (item) {
            var matchCat = (currentCat === 'all' || item.catId === currentCat);
            var matchQuery = (!q || item.name.includes(q) || item.desc.includes(q));
            item.el.style.display = (matchCat && matchQuery) ? 'flex' : 'none';
        });

        document.querySelectorAll('.cat-section').forEach(function (sec) {
            var hasVisible = sec.querySelectorAll('.app-tile:not([style*="display: none"])').length > 0;
            sec.style.display = hasVisible ? 'block' : 'none';
        });
    }

    renderStore();

    document.querySelectorAll('#sidebar-cats .nav-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('#sidebar-cats .nav-btn').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentCat = btn.dataset.cat;
            filterStore();
        });
    });

    searchInput.addEventListener('input', filterStore);

    // Điều hướng D-Pad cho Remote TV
    document.addEventListener('keydown', function (ev) {
        var cur = ev.target.closest && ev.target.closest('.app-tile');
        var dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
        if (!cur || !dir) return;
        var o = cur.getBoundingClientRect(), best = null, bestScore = Infinity;
        document.querySelectorAll('.app-tile').forEach(function (c) {
            if (c === cur || c.offsetParent === null) return;
            var r = c.getBoundingClientRect();
            var dx = (r.left + r.right - o.left - o.right) / 2, dy = (r.top + r.bottom - o.top - o.bottom) / 2;
            var p = dx * dir[0] + dy * dir[1], cross = Math.abs(dx * dir[1] + dy * dir[0]);
            if (p <= 8 || (dir[0] && cross > o.height / 2)) return;
            var s = p + cross * 2; if (s < bestScore) { best = c; bestScore = s; }
        });
        if (best) { ev.preventDefault(); best.focus(); best.scrollIntoView({ block: 'nearest' }); }
    });

    // Tự động nhận diện thiết bị & tối ưu kích thước hiển thị
    function applyAutoDeviceOptimization() {
        var ua = navigator.userAgent || '';
        var w = window.innerWidth;
        var isTV = /TV|Android.*(AFT|BRAVIA|MiBOX|MIBOX|SHIELD|GoogleTV|SmartTV|Tizen|Web0S)/i.test(ua) || (w >= 1600);
        var isMobile = w <= 640 || /iPhone|Android.*Mobile/i.test(ua);
        var isTablet = !isMobile && (w <= 1024 || /iPad|Tablet/i.test(ua));
        var badge = document.getElementById('device-indicator');
        if (isTV) {
            document.body.dataset.device = 'tv';
            if (badge) badge.textContent = '📺 Smart TV Mode';
        } else if (isMobile) {
            document.body.dataset.device = 'mobile';
            if (badge) badge.textContent = '📱 Mobile Fit';
        } else if (isTablet) {
            document.body.dataset.device = 'tablet';
            if (badge) badge.textContent = '📲 Tablet Fit';
        } else {
            document.body.dataset.device = 'desktop';
            if (badge) badge.textContent = '💻 Desktop Fit';
        }
    }
    applyAutoDeviceOptimization();
    window.addEventListener('resize', applyAutoDeviceOptimization);

    // Bấm 3 lần vào chữ "App Store" ở góc phải để mở nhanh Admin TV
    var clicks = 0, timer;
    document.getElementById('secret-tv-admin').addEventListener('click', function() {
        clicks++;
        clearTimeout(timer);
        if (clicks >= 3) {
            clicks = 0;
            window.location.href = 'admin.html';
        } else {
            timer = setTimeout(function() { clicks = 0; }, 1200);
        }
    });
})();
</script>
