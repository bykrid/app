<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>6789 — Kho Ứng Dụng TV</title>
<style>
:root {
    --font-sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    --bg-base: #111113;
    --bg-window: #1c1c1e;
    --bg-sidebar: #161618;
    --bg-card: #242426;
    --bg-card-hover: #2c2c2e;
    --border-hairline: rgba(255, 255, 255, 0.08);
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --mac-blue: #0071e3;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: var(--font-sf);
    background-color: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
}

/* ================= macOS Minimal Menu Bar ================= */
.menubar {
    height: 30px;
    padding: 0 18px;
    background: rgba(22, 22, 24, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--border-hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    position: sticky;
    top: 0;
    z-index: 100;
}
.menubar-left, .menubar-right {
    display: flex;
    align-items: center;
    gap: 16px;
}
.menubar a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.15s;
}
.menubar a:hover, .menubar a.active {
    color: var(--text-primary);
}
.menubar a.brand {
    color: var(--text-primary);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* ================= Main macOS Window ================= */
.app-container {
    flex: 1;
    max-width: 1280px;
    width: 100%;
    margin: 18px auto 24px;
    padding: 0 16px;
}

.mac-window {
    display: grid;
    grid-template-columns: 230px 1fr;
    min-height: calc(100vh - 84px);
    background: var(--bg-window);
    border: 0.5px solid var(--border-hairline);
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    background: var(--bg-sidebar);
    border-right: 0.5px solid var(--border-hairline);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.traffic-lights {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 6px;
}
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot-r { background: #ff5f56; }
.dot-y { background: #ffbd2e; }
.dot-g { background: #27c93f; }

.search-wrap { position: relative; }
.search-input {
    width: 100%;
    padding: 7px 10px 7px 30px;
    border-radius: 7px;
    background: #242426;
    border: 0.5px solid var(--border-hairline);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
}
.search-input:focus {
    border-color: var(--mac-blue);
}
.search-ico {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: var(--text-secondary); pointer-events: none;
}

.nav-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    padding: 0 10px;
    margin-bottom: -6px;
}

.nav-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 7px;
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    text-decoration: none;
    transition: background-color 0.12s, color 0.12s;
}
.nav-btn:hover, .nav-btn:focus-visible {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
    outline: none;
}
.nav-btn.active {
    background: #2c2c2e;
    color: var(--text-primary);
    font-weight: 600;
}

.sidebar-bottom {
    margin-top: auto;
    padding-top: 12px;
    border-top: 0.5px solid var(--border-hairline);
    display: flex;
    flex-direction: column;
    gap: 2px;
}

/* Main Content */
.content-area {
    padding: 26px 30px 40px;
    overflow-y: auto;
}

.page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 0.5px solid var(--border-hairline);
}
.page-header h1 {
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: -0.02em;
}
.page-header span {
    font-size: 13px;
    color: var(--text-secondary);
}

/* Category Section */
.cat-section {
    margin-bottom: 32px;
}
.cat-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
}

/* App Grid */
.app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
}

.app-tile {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 15px;
    border-radius: 12px;
    background: var(--bg-card);
    border: 0.5px solid var(--border-hairline);
    text-decoration: none;
    color: var(--text-primary);
    transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.app-tile:hover, .app-tile:focus-visible {
    outline: none;
    background: var(--bg-card-hover);
    border-color: rgba(255, 255, 255, 0.22);
    transform: translateY(-1px);
}

.app-tile:active {
    transform: scale(0.99);
}

.app-icon {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    object-fit: contain;
    background: #18181a;
    flex-shrink: 0;
    border: 0.5px solid rgba(255, 255, 255, 0.06);
    display: grid;
    place-items: center;
    font-size: 1.5rem;
}

.app-meta {
    flex: 1;
    min-width: 0;
}

.app-name {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.app-desc {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.btn-get {
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    transition: background-color 0.15s, color 0.15s;
}
.app-tile:hover .btn-get, .app-tile:focus-visible .btn-get {
    background: var(--mac-blue);
    color: #fff;
}

/* Toast Notification */
.mac-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 200;
    background: #2c2c2e;
    border: 0.5px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

@media (max-width: 820px) {
    .mac-window {
        grid-template-columns: 1fr;
    }
    .sidebar {
        border-right: 0;
        border-bottom: 0.5px solid var(--border-hairline);
    }
    .nav-list {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 4px;
    }
    .nav-btn { white-space: nowrap; }
    .content-area { padding: 20px 16px 32px; }
    .page-header { flex-direction: column; gap: 4px; }
}
</style>
</head>
<body>

<header class="menubar">
    <div class="menubar-left">
        <a href="../" class="brand">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.96 6.33c.64-.78 1.08-1.86.96-2.94-.93.04-2.06.62-2.72 1.4-.58.68-1.1 1.79-.96 2.84 1.04.08 2.08-.52 2.72-1.3z"/></svg>
            <span>6789</span>
        </a>
        <a href="../">Trung Tâm</a>
        <a href="./" class="active">Kho App TV</a>
        <a href="../frp/">FRP Tools</a>
    </div>
    <div class="menubar-right">
        <span id="secret-tv-admin" style="color: var(--text-secondary); cursor: default; user-select: none;">App Store</span>
    </div>
</header>

<div class="app-container">
    <div class="mac-window">
        <aside class="sidebar">
            <div class="traffic-lights">
                <a href="../" class="dot dot-r" title="Về Trung Tâm"></a>
                <span class="dot dot-y"></span>
                <span class="dot dot-g"></span>
            </div>

            <div class="search-wrap">
                <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" class="search-input" placeholder="Tìm nhanh..." autocomplete="off">
            </div>

            <div class="nav-label">Danh Mục</div>
            <nav class="nav-list" id="sidebar-cats">
                <button type="button" class="nav-btn active" data-cat="all">Tất Cả Ứng Dụng</button>
                <button type="button" class="nav-btn" data-cat="cat-youtube">YouTube & Giải Trí</button>
                <button type="button" class="nav-btn" data-cat="cat-tv">Truyền Hình & Thể Thao</button>
                <button type="button" class="nav-btn" data-cat="cat-phim">Xem Phim 4K</button>
                <button type="button" class="nav-btn" data-cat="cat-voice">Trợ Lý Giọng Nói</button>
                <button type="button" class="nav-btn" data-cat="cat-tool">Tiện Ích Hệ Thống</button>
            </nav>

            <div class="sidebar-bottom">
                <a href="../" class="nav-btn">← Quay Lại Trung Tâm</a>
            </div>
        </aside>

        <main class="content-area">
            <div class="page-header">
                <h1>Kho Ứng Dụng Android TV</h1>
                <span>Chọn ứng dụng để tải trực tiếp gói cài đặt APK</span>
            </div>

            <div id="catalog"></div>
        </main>
    </div>
</div>

<div class="mac-toast" id="toast" hidden></div>

<script src="data/apps.js"></script>
<script>
(function () {
    var catalog = document.getElementById('catalog');
    var searchInput = document.getElementById('search-input');
    var toast = document.getElementById('toast');
    var toastTimer;
    var allItems = [];
    var currentCat = 'all';

    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
    }

    function createAppTile(app) {
        var a = el('a', 'app-tile');
        a.href = app.url;
        a.setAttribute('download', app.name + '.apk');

        var img = el('img', 'app-icon');
        img.src = app.icon || 'icons/default.png';
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = function() {
            img.replaceWith(el('div', 'app-icon', '📦'));
        };

        var meta = el('div', 'app-meta');
        meta.append(
            el('span', 'app-name', app.name),
            el('span', 'app-desc', app.desc || 'Gói APK Android TV')
        );

        var btn = el('span', 'btn-get', 'Tải APK');
        a.append(img, meta, btn);

        a.addEventListener('click', function () {
            toast.textContent = 'Đang tải xuống: ' + app.name + '.apk';
            toast.hidden = false;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toast.hidden = true; }, 3000);
        });

        return {
            el: a,
            name: app.name.toLowerCase(),
            desc: (app.desc || '').toLowerCase()
        };
    }

    function renderStore() {
        catalog.innerHTML = '';
        allItems = [];
        var data = window.STORE_DATA || [];

        data.forEach(function (cat) {
            var sec = el('section', 'cat-section');
            sec.dataset.catId = cat.id;
            sec.append(el('h2', 'cat-title', cat.title));

            var grid = el('div', 'app-grid');
            cat.apps.forEach(function (app) {
                var tileObj = createAppTile(app);
                tileObj.catId = cat.id;
                allItems.push(tileObj);
                grid.append(tileObj.el);
            });

            sec.append(grid);
            catalog.append(sec);
        });
    }

    function filterStore() {
        var q = searchInput.value.trim().toLowerCase();
        allItems.forEach(function (item) {
            var matchCat = (currentCat === 'all' || item.catId === currentCat);
            var matchQuery = (!q || item.name.includes(q) || item.desc.includes(q));
            item.el.style.display = (matchCat && matchQuery) ? 'flex' : 'none';
        });

        document.querySelectorAll('.cat-section').forEach(function (sec) {
            var hasVisible = sec.querySelectorAll('.app-tile:not([style*="display: none"])').length > 0;
            sec.style.display = hasVisible ? 'block' : 'none';
        });
    }

    renderStore();

    document.querySelectorAll('#sidebar-cats .nav-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('#sidebar-cats .nav-btn').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentCat = btn.dataset.cat;
            filterStore();
        });
    });

    searchInput.addEventListener('input', filterStore);

    // Điều hướng D-Pad cho Remote TV
    document.addEventListener('keydown', function (ev) {
        var cur = ev.target.closest && ev.target.closest('.app-tile');
        var dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
        if (!cur || !dir) return;
        var o = cur.getBoundingClientRect(), best = null, bestScore = Infinity;
        document.querySelectorAll('.app-tile').forEach(function (c) {
            if (c === cur || c.offsetParent === null) return;
            var r = c.getBoundingClientRect();
            var dx = (r.left + r.right - o.left - o.right) / 2, dy = (r.top + r.bottom - o.top - o.bottom) / 2;
            var p = dx * dir[0] + dy * dir[1], cross = Math.abs(dx * dir[1] + dy * dir[0]);
            if (p <= 8 || (dir[0] && cross > o.height / 2)) return;
            var s = p + cross * 2; if (s < bestScore) { best = c; bestScore = s; }
        });
        if (best) { ev.preventDefault(); best.focus(); best.scrollIntoView({ block: 'nearest' }); }
    });

    // Bấm 3 lần vào chữ "App Store" ở góc phải để mở nhanh Admin TV
    var clicks = 0, timer;
    document.getElementById('secret-tv-admin').addEventListener('click', function() {
        clicks++;
        clearTimeout(timer);
        if (clicks >= 3) {
            clicks = 0;
            window.location.href = 'admin.html';
        } else {
            timer = setTimeout(function() { clicks = 0; }, 1200);
        }
    });
})();
</script>
</body>
</html>
