<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>6789 — FRP & Mobile Tools</title>
<style>
:root {
    --font-sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    --bg-base: #111113;
    --bg-window: #1c1c1e;
    --bg-sidebar: #161618;
    --bg-group: #242426;
    --bg-row-hover: #2c2c2e;
    --border-hairline: rgba(255, 255, 255, 0.08);
    --text-primary: #f5f5f7;
    --text-secondary: #86868b;
    --mac-blue: #0071e3;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: var(--font-sf);
    background-color: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
}

/* ================= macOS Minimal Menu Bar ================= */
.menubar {
    height: 30px;
    padding: 0 18px;
    background: rgba(22, 22, 24, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--border-hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    position: sticky;
    top: 0;
    z-index: 100;
}
.menubar-left, .menubar-right {
    display: flex;
    align-items: center;
    gap: 16px;
}
.menubar a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.15s;
}
.menubar a:hover, .menubar a.active {
    color: var(--text-primary);
}
.menubar a.brand {
    color: var(--text-primary);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

/* ================= macOS System Settings Window ================= */
.settings-wrapper {
    flex: 1;
    max-width: 1120px;
    width: 100%;
    margin: 18px auto 28px;
    padding: 0 16px;
}

.mac-window {
    display: grid;
    grid-template-columns: 230px 1fr;
    min-height: calc(100vh - 86px);
    background: var(--bg-window);
    border: 0.5px solid var(--border-hairline);
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    overflow: hidden;
}

/* Sidebar */
.sidebar {
    background: var(--bg-sidebar);
    border-right: 0.5px solid var(--border-hairline);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.traffic-lights {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 6px;
}
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot-r { background: #ff5f56; }
.dot-y { background: #ffbd2e; }
.dot-g { background: #27c93f; }

.search-wrap { position: relative; }
.search-input {
    width: 100%;
    padding: 7px 10px 7px 30px;
    border-radius: 7px;
    background: #242426;
    border: 0.5px solid var(--border-hairline);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s;
}
.search-input:focus {
    border-color: var(--mac-blue);
}
.search-ico {
    position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
    width: 13px; height: 13px; color: var(--text-secondary); pointer-events: none;
}

.nav-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    padding: 0 10px;
    margin-bottom: -6px;
}

.nav-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 7px;
    border: 0;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    text-decoration: none;
    transition: background-color 0.12s, color 0.12s;
}
.nav-item:hover {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-primary);
}
.nav-item.active {
    background: #2c2c2e;
    color: var(--text-primary);
    font-weight: 600;
}

.sidebar-bottom {
    margin-top: auto;
    padding-top: 12px;
    border-top: 0.5px solid var(--border-hairline);
}

/* Main Content */
.settings-content {
    padding: 26px 32px 44px;
    overflow-y: auto;
}

.page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 0.5px solid var(--border-hairline);
}
.page-header h1 {
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: -0.02em;
}
.page-header span {
    font-size: 13px;
    color: var(--text-secondary);
}

/* macOS Grouped Settings Box */
.settings-section {
    margin-bottom: 26px;
}
.section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 0 0 8px 4px;
}

.mac-group {
    background: var(--bg-group);
    border: 0.5px solid var(--border-hairline);
    border-radius: 12px;
    overflow: hidden;
}

.mac-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 12px 16px;
    text-decoration: none;
    color: var(--text-primary);
    border-bottom: 0.5px solid var(--border-hairline);
    transition: background-color 0.12s ease;
}
.mac-row:last-child {
    border-bottom: 0;
}
.mac-row:hover, .mac-row:focus-visible {
    background: var(--bg-row-hover);
    outline: none;
}

.row-left {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
}

.row-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #18181a;
    border: 0.5px solid var(--border-hairline);
    display: grid;
    place-items: center;
    font-size: 15px;
    flex-shrink: 0;
    color: var(--text-primary);
    overflow: hidden;
}
.row-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.row-text {
    min-width: 0;
}
.row-text strong {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 2px;
}
.row-text small {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.mac-action-pill {
    padding: 5px 13px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-primary);
    cursor: pointer;
    transition: background-color 0.12s, border-color 0.12s;
}
.mac-row:hover .mac-action-pill, .mac-action-pill:hover {
    background: var(--mac-blue);
    border-color: var(--mac-blue);
    color: #fff;
}

.email-input {
    background: #161618;
    border: 0.5px solid var(--border-hairline);
    border-radius: 6px;
    padding: 5px 10px;
    color: var(--text-primary);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    width: 190px;
    outline: none;
}

.mac-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 200;
    background: #2c2c2e;
    border: 0.5px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}

/* ================= Auto-Responsive & Multi-Device Optimization ================= */
.device-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 999px;
    background: rgba(0, 113, 227, 0.14);
    border: 0.5px solid rgba(100, 210, 255, 0.25);
    color: #64d2ff;
    font-size: 11px;
    font-weight: 600;
}

.mac-row:focus-visible {
    outline: 2px solid #64d2ff;
    outline-offset: -2px;
    background: #303034;
}

@media (min-width: 1600px) {
    .settings-wrapper { max-width: 1420px; padding: 0 28px; }
    .mac-window { grid-template-columns: 260px 1fr; }
    .mac-row { padding: 15px 20px; }
    .row-icon { width: 42px; height: 42px; border-radius: 10px; font-size: 18px; }
    .row-text strong { font-size: 15px; }
    .row-text small { font-size: 13px; }
    .mac-action-pill { padding: 7px 16px; font-size: 13px; }
}

@media (max-width: 820px) {
    .settings-wrapper { margin: 8px auto 16px; padding: 0 8px; }
    .mac-window {
        grid-template-columns: 1fr;
        min-height: calc(100vh - 54px);
        border-radius: 14px;
    }
    .sidebar {
        border-right: 0;
        border-bottom: 0.5px solid var(--border-hairline);
        padding: 12px;
        gap: 10px;
        position: sticky;
        top: 30px;
        z-index: 50;
        background: rgba(22, 22, 24, 0.94);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
    }
    .traffic-lights, .nav-label, .sidebar-bottom { display: none; }
    .nav-list {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 2px;
        gap: 6px;
        scrollbar-width: none;
    }
    .nav-list::-webkit-scrollbar { display: none; }
    .nav-item {
        white-space: nowrap;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 12.5px;
    }
    .nav-item.active {
        background: var(--mac-blue);
        color: #fff;
    }
    .settings-content { padding: 16px 12px 28px; }
    .page-header { flex-direction: column; gap: 4px; margin-bottom: 16px; }
    .page-header h1 { font-size: 1.25rem; }
    .email-input { width: 145px; }
}

@media (max-width: 480px) {
    .menubar { padding: 0 10px; font-size: 11.5px; }
    .menubar-left { gap: 10px; }
    .mac-row { padding: 11px 12px; gap: 10px; }
    .row-icon { width: 34px; height: 34px; }
    .row-text strong { font-size: 13px; }
    .row-text small { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .mac-action-pill { padding: 5px 10px; font-size: 11.5px; }
}
</style>
</head>
<body>

<header class="menubar">
    <div class="menubar-left">
        <a href="../" class="brand">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.96 6.33c.64-.78 1.08-1.86.96-2.94-.93.04-2.06.62-2.72 1.4-.58.68-1.1 1.79-.96 2.84 1.04.08 2.08-.52 2.72-1.3z"/></svg>
            <span>6789</span>
        </a>
        <a href="../">Trung Tâm</a>
        <a href="./" class="active">FRP Tools</a>
        <a href="../tv/">Kho App TV</a>
    </div>
    <div class="menubar-right">
        <span id="secret-frp-admin" style="color: var(--text-secondary); cursor: default; user-select: none;">System Settings</span>
    </div>
</header>

<div class="settings-wrapper">
    <div class="mac-window">
        <aside class="sidebar">
            <div class="traffic-lights">
                <a href="../" class="dot dot-r" title="Về Trung Tâm"></a>
                <span class="dot dot-y"></span>
                <span class="dot dot-g"></span>
            </div>

            <div class="search-wrap">
                <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" class="search-input" placeholder="Tìm công cụ..." autocomplete="off">
            </div>

            <div class="nav-label">Công Cụ</div>
            <nav class="nav-list" id="filter-nav">
                <button type="button" class="nav-item active" data-sec="all">Tất Cả Công Cụ</button>
                <button type="button" class="nav-item" data-sec="sec-intent">Android Intent</button>
                <button type="button" class="nav-item" data-sec="sec-apk">Gói APK Bypass</button>
                <button type="button" class="nav-item" data-sec="sec-ios">Tiện Ích iOS / Profile</button>
            </nav>

            <div class="sidebar-bottom">
                <a href="../" class="nav-item">← Quay Lại Trung Tâm</a>
            </div>
        </aside>

        <main class="settings-content">
            <div class="page-header">
                <h1>FRP Bypass & Mobile Tools</h1>
                <span>Bảng điều khiển gọi nhanh Intent & gói cài đặt kỹ thuật</span>
            </div>

            <!-- DANH SÁCH CÔNG CỤ ĐỘNG TỪ data/tools.js -->
            <div id="tools-container"></div>
            <!-- TÀI KHOẢN EMAIL MDM (ĐẶT Ở CUỐI TRANG) -->
            <div class="settings-section" data-group="sec-intent">
                <div class="section-label">Tài Khoản MDM</div>
                <div class="mac-group">
                    <div class="mac-row">
                        <div class="row-left">
                            <div class="row-icon">✉️</div>
                            <div class="row-text">
                                <strong>Email Liên Kết MDM</strong>
                                <small>Sao chép nhanh vào bộ nhớ tạm</small>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <input type="text" id="mdm-mail" class="email-input" value="qimao@mdm.sqqmkj.com" readonly>
                            <button type="button" id="btn-copy" class="mac-action-pill">Sao Chép</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="mac-toast" id="toast" hidden></div>

<script src="data/tools.js"></script>
<script>
(function() {
    var container = document.getElementById('tools-container');
    function getFrpData() {
        var rawStore = window.FRP_DATA ? JSON.parse(JSON.stringify(window.FRP_DATA)) : [];
        var savedFrp = localStorage.getItem('6789_frp_data');
        if (!savedFrp) return rawStore;
        try {
            var local = JSON.parse(savedFrp);
            var localMap = {};
            local.forEach(function (sec) {
                (sec.items || []).forEach(function (i) {
                    localMap[i.title] = i;
                });
            });
            rawStore.forEach(function (sec) {
                (sec.items || []).forEach(function (i) {
                    var localItem = localMap[i.title];
                    if (localItem && localItem.hidden !== undefined) {
                        i.hidden = localItem.hidden;
                    }
                });
            });
            return rawStore;
        } catch (e) {
            return rawStore;
        }
    }
    var data = getFrpData();

    function renderTools() {
        container.innerHTML = '';
        data.forEach(function(section) {
            var secEl = document.createElement('div');
            secEl.className = 'settings-section';
            secEl.dataset.group = section.id;

            var labelEl = document.createElement('div');
            labelEl.className = 'section-label';
            labelEl.textContent = section.title;
            secEl.appendChild(labelEl);

            var groupEl = document.createElement('div');
            groupEl.className = 'mac-group';

            section.items.forEach(function(item) {
                if (item.hidden) return;
                var a = document.createElement('a');
                a.className = 'mac-row searchable';
                a.href = item.url;
                if (item.download || item.url.match(/\.apk$/i)) {
                    a.setAttribute('download', '');
                } else if (item.url.startsWith('http') && !item.url.match(/\.mobileconfig$/i)) {
                    a.target = '_blank';
                }

                var isImgIcon = item.icon && (item.icon.includes('/') || item.icon.includes('.png') || item.icon.includes('.jpg') || item.icon.includes('.webp') || item.icon.startsWith('http'));
                var iconHtml = isImgIcon
                    ? '<img src="' + item.icon + '" alt="" onerror="this.src=\'icons/default.png\';this.onerror=function(){this.parentNode.textContent=\'🛠️\';}">'
                    : (item.icon || '🛠️');

                a.innerHTML = `
                    <div class="row-left">
                        <div class="row-icon">${iconHtml}</div>
                        <div class="row-text">
                            <strong>${item.name}</strong>
                            <small>${item.desc || ''}</small>
                        </div>
                    </div>
                    <span class="mac-action-pill">${item.actionText || 'Mở →'}</span>
                `;
                groupEl.appendChild(a);
            });

            if (groupEl.children.length > 0) {
                secEl.appendChild(groupEl);
                container.appendChild(secEl);
            }
        });
    }

    renderTools();

    // Sao chép email MDM
    document.getElementById('btn-copy').addEventListener('click', function () {
        var input = document.getElementById('mdm-mail');
        input.select();
        navigator.clipboard.writeText(input.value).then(function () {
            var t = document.getElementById('toast');
            t.textContent = 'Đã sao chép: ' + input.value;
            t.hidden = false;
            setTimeout(function () { t.hidden = true; }, 2500);
        });
    });

    // Lọc theo danh mục Sidebar
    document.querySelectorAll('#filter-nav .nav-item[data-sec]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('#filter-nav .nav-item').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            var sec = btn.dataset.sec;
            document.querySelectorAll('.settings-section').forEach(function (el) {
                el.style.display = (sec === 'all' || el.dataset.group === sec) ? 'block' : 'none';
            });
        });
    });

    // Tìm kiếm tức thì
    document.getElementById('search-input').addEventListener('input', function (e) {
        var q = e.target.value.trim().toLowerCase();
        document.querySelectorAll('.searchable').forEach(function (row) {
            var match = !q || row.textContent.toLowerCase().includes(q);
            row.style.display = match ? 'flex' : 'none';
        });
    });

    // Bấm 3 lần vào chữ "System Settings" ở góc phải để mở nhanh Admin FRP
    var clicks = 0, timer;
    document.getElementById('secret-frp-admin').addEventListener('click', function() {
        clicks++;
        clearTimeout(timer);
        if (clicks >= 3) {
            clicks = 0;
            window.location.href = 'admin.html';
        } else {
            timer = setTimeout(function() { clicks = 0; }, 1200);
        }
    });
})();
</script>
</body>
</html>
